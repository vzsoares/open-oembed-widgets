<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quote · Open oEmbed Widget</title>
        <meta
            name="description"
            content="A quote from a chosen collection — a monochrome widget you can embed in Notion or any oEmbed consumer."
        />
        <link rel="icon" href="/favicon.ico" />

        <!-- oEmbed discovery: consumers (e.g. Notion via Iframely) fetch this -->
        <link
            rel="alternate"
            type="application/json+oembed"
            href="https://vzsoares.github.io/open-oembed-widgets/quote/oembed.json"
            title="Quote"
        />

        <!-- Open Graph fallback for consumers that don't use oEmbed -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Quote" />
        <meta
            property="og:description"
            content="A quote from a chosen collection."
        />
        <meta
            property="og:url"
            content="https://vzsoares.github.io/open-oembed-widgets/quote/"
        />
        <meta
            property="og:image"
            content="https://vzsoares.github.io/open-oembed-widgets/og.png"
        />
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:image"
            content="https://vzsoares.github.io/open-oembed-widgets/og.png"
        />

        <link rel="stylesheet" href="/src/styles.css" />
        <script type="module" src="/src/widgets/quote/index.ts"></script>
    </head>
    <body class="font-sans">
        <main
            x-data="quoteWidget"
            x-cloak
            class="flex min-h-screen w-full items-center justify-center p-5 text-fg"
        >
            <section class="w-full max-w-md" aria-live="polite">
                <div class="flex items-start justify-between gap-3">
                    <span
                        class="font-mono text-[0.7rem] uppercase tracking-[0.18em] text-muted"
                        x-text="config.collection"
                    ></span>
                    <button
                        type="button"
                        @click="shuffle()"
                        class="shrink-0 rounded-full border border-border px-2.5 py-1 text-xs transition-colors hover:bg-fg hover:text-bg"
                        aria-label="Another quote"
                        title="Another quote"
                    >
                        ↻
                    </button>
                </div>

                <figure class="mt-3">
                    <blockquote
                        class="font-serif text-xl leading-snug"
                        x-text="'“' + quote.text + '”'"
                    ></blockquote>
                    <figcaption
                        class="mt-4 font-mono text-[0.7rem] uppercase tracking-[0.12em] text-muted"
                        x-text="'— ' + quote.author"
                    ></figcaption>
                </figure>
            </section>
        </main>
    </body>
</html>
