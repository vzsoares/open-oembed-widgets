<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>World Clock · Open oEmbed Widget</title>
        <meta
            name="description"
            content="The current time across several timezones at once — a monochrome widget you can embed in Notion or any oEmbed consumer."
        />
        <link rel="icon" href="/favicon.ico" />

        <!-- oEmbed discovery: consumers (e.g. Notion via Iframely) fetch this -->
        <link
            rel="alternate"
            type="application/json+oembed"
            href="https://vzsoares.github.io/open-oembed-widgets/worldclock/oembed.json"
            title="World Clock"
        />

        <!-- Open Graph fallback for consumers that don't use oEmbed -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="World Clock" />
        <meta
            property="og:description"
            content="The current time across several timezones at once."
        />
        <meta
            property="og:url"
            content="https://vzsoares.github.io/open-oembed-widgets/worldclock/"
        />
        <meta
            property="og:image"
            content="https://vzsoares.github.io/open-oembed-widgets/og.png"
        />
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:image"
            content="https://vzsoares.github.io/open-oembed-widgets/og.png"
        />

        <link rel="stylesheet" href="/src/styles.css" />
        <script type="module" src="/src/widgets/worldclock/index.ts"></script>
    </head>
    <body class="font-sans">
        <main
            x-data="worldClockWidget"
            x-cloak
            class="flex min-h-screen w-full select-none items-center justify-center p-5 text-fg"
            aria-live="polite"
        >
            <div class="flex w-full max-w-xs flex-col gap-3">
                <template x-for="c in clocks" :key="c.label">
                    <div
                        class="flex items-baseline justify-between gap-4 border-b border-border pb-2 last:border-0 last:pb-0"
                    >
                        <div class="min-w-0">
                            <p
                                class="truncate text-sm font-semibold"
                                x-text="c.label"
                            ></p>
                            <p
                                class="font-mono text-[0.6rem] uppercase tracking-wide text-muted"
                                x-text="c.caption"
                            ></p>
                        </div>
                        <div class="flex items-baseline gap-1">
                            <span
                                class="font-mono text-2xl font-bold tabular-nums"
                                :class="!c.valid && 'text-muted'"
                                x-text="c.time"
                            ></span>
                            <span
                                x-show="c.meridiem"
                                class="font-mono text-[0.6rem] uppercase tracking-wide text-muted"
                                x-text="c.meridiem"
                            ></span>
                        </div>
                    </div>
                </template>
            </div>
        </main>
    </body>
</html>
