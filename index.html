<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Notion oEmbed Widgets</title>
        <meta
            name="description"
            content="Tiny, monochrome, client-side widgets you can embed in Notion via oEmbed."
        />
        <meta name="author" content="vzsoares" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Notion oEmbed Widgets" />
        <meta
            property="og:description"
            content="Tiny, monochrome, client-side widgets you can embed in Notion via oEmbed."
        />
        <link rel="icon" href="/favicon.ico" />

        <link rel="stylesheet" href="/src/styles.css" />
        <script type="module" src="/src/home.ts"></script>
    </head>
    <body class="bg-bg font-sans text-fg" x-data="home" x-cloak>
        <div class="mx-auto max-w-2xl px-6 py-12 sm:py-16">
            <header class="flex items-start justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-semibold tracking-tight">
                        Notion oEmbed Widgets
                    </h1>
                    <p class="mt-2 max-w-prose text-sm leading-relaxed text-muted">
                        Tiny, monochrome, client-side widgets you can embed in
                        Notion (or any oEmbed consumer). Pick a theme and range,
                        copy the URL, paste it into Notion, and choose “Embed”.
                    </p>
                </div>
                <button
                    type="button"
                    @click="toggle()"
                    class="shrink-0 rounded-full border border-border px-3 py-1.5 text-xs transition-colors hover:bg-fg hover:text-bg"
                    aria-label="Toggle theme"
                    x-text="themeLabel"
                ></button>
            </header>

            <section class="mt-10 space-y-6">
                <template x-for="w in widgets" :key="w.id">
                    <article
                        class="rounded-xl border border-border p-5 transition-colors hover:border-fg/40"
                    >
                        <div class="flex items-baseline justify-between gap-3">
                            <h2
                                class="text-base font-medium"
                                x-text="w.title"
                            ></h2>
                            <a
                                :href="widgetUrl(w)"
                                target="_blank"
                                class="text-xs text-muted underline underline-offset-4 transition-colors hover:text-fg"
                                >Open ↗</a
                            >
                        </div>
                        <p
                            class="mt-1 text-sm text-muted"
                            x-text="w.description"
                        ></p>

                        <!-- Range selector (chart widgets) -->
                        <template x-if="w.ranges">
                            <div class="mt-4 flex flex-wrap items-center gap-1">
                                <span class="mr-1 text-xs text-muted"
                                    >Range</span
                                >
                                <template
                                    x-for="r in w.ranges"
                                    :key="r.id"
                                >
                                    <button
                                        type="button"
                                        @click="setRange(w, r.id)"
                                        class="rounded px-2 py-1 font-mono text-[0.7rem] uppercase tracking-wide transition-colors"
                                        :class="r.id === selected[w.id] ? 'bg-fg text-bg' : 'border border-border text-muted hover:text-fg'"
                                        x-text="r.label"
                                    ></button>
                                </template>
                            </div>
                        </template>

                        <!-- Live preview of the actual embed -->
                        <div
                            class="mt-4 overflow-hidden rounded-lg border border-border"
                        >
                            <iframe
                                title="Widget preview"
                                :src="widgetUrl(w)"
                                :title="w.title + ' preview'"
                                :height="w.height"
                                class="block w-full"
                                loading="lazy"
                            ></iframe>
                        </div>

                        <!-- Copyable embed URL -->
                        <div class="mt-4 flex items-center gap-2">
                            <code
                                class="flex-1 truncate rounded border border-border px-2.5 py-1.5 font-mono text-xs text-muted"
                                x-text="embedUrl(w)"
                            ></code>
                            <button
                                type="button"
                                @click="copy(w)"
                                class="shrink-0 rounded border border-border px-3 py-1.5 text-xs transition-colors hover:bg-fg hover:text-bg"
                                x-text="copiedId === w.id ? 'Copied' : 'Copy'"
                            ></button>
                        </div>
                    </article>
                </template>
            </section>

            <footer
                class="mt-12 border-t border-border pt-6 text-xs text-muted"
            >
                <a
                    href="https://github.com/vzsoares/notion-oembed-widgets"
                    target="_blank"
                    class="underline underline-offset-4 transition-colors hover:text-fg"
                    >Source on GitHub</a
                >
                · oEmbed-compliant · client-side only
            </footer>
        </div>
    </body>
</html>
