<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Progress · Open oEmbed Widget</title>
        <meta
            name="description"
            content="A progress bar for the year, a date range, or any value — a monochrome widget you can embed in Notion or any oEmbed consumer."
        />
        <link rel="icon" href="/favicon.ico" />

        <!-- oEmbed discovery: consumers (e.g. Notion via Iframely) fetch this -->
        <link
            rel="alternate"
            type="application/json+oembed"
            href="https://vzsoares.github.io/open-oembed-widgets/progress/oembed.json"
            title="Progress"
        />

        <!-- Open Graph fallback for consumers that don't use oEmbed -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Progress" />
        <meta
            property="og:description"
            content="A progress bar for the year, a date range, or any value."
        />
        <meta
            property="og:url"
            content="https://vzsoares.github.io/open-oembed-widgets/progress/"
        />
        <meta name="twitter:card" content="summary" />

        <link rel="stylesheet" href="/src/styles.css" />
        <script type="module" src="/src/widgets/progress/index.ts"></script>
    </head>
    <body class="font-sans">
        <main
            x-data="progressWidget"
            x-cloak
            class="flex min-h-screen w-full flex-col items-center justify-center p-5 text-fg"
            aria-live="polite"
        >
            <section class="w-full max-w-md">
                <div class="flex items-baseline justify-between gap-3">
                    <span
                        class="text-sm font-bold tracking-tight"
                        x-text="view.label"
                    ></span>
                    <span
                        class="font-mono text-2xl font-semibold tabular-nums"
                        x-text="view.percent + '%'"
                    ></span>
                </div>
                <div
                    class="mt-2 h-3 w-full overflow-hidden rounded-full bg-border"
                    role="progressbar"
                    :aria-valuenow="view.percent"
                    aria-valuemin="0"
                    aria-valuemax="100"
                >
                    <div
                        class="h-full rounded-full bg-fg transition-[width] duration-500 ease-out"
                        :style="`width: ${view.percent}%`"
                    ></div>
                </div>
            </section>
        </main>
    </body>
</html>
